---
# playbooks/species/archiver_dev.yml
# Deprecated alias of archiver_dev_uds, kept until epicsarchiverap-env moves to
# the new species names (cloud-provision renamed archiver-dev to archiver-dev-uds).
- name: Report the deprecated species name
  hosts: vacua
  gather_facts: false
  tasks:
    - name: Say that the archiver_dev species is now archiver_dev_uds
      ansible.builtin.debug:
        msg: "The archiver_dev species is deprecated; use archiver_dev_uds, archiver_dev_tcp or archiver_dev_sqlite."
      run_once: true
- import_playbook: archiver_dev_uds.yml
