---
# playbooks/operators/archiver_build.yml
# One operator, one playbook. Species assemblies import these in the
# operator definition's order; runs are scoped with --limit.
- name: Apply the archiver_build operator
  hosts: vacua
  gather_facts: false
  become: yes
  roles:
    - role: proxy_check
      when: proxy_scope | default('cloud') == 'general-server'
      tags: [archiver_build]
    - role: archiver_build
      tags: [archiver_build]
