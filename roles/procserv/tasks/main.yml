---
# roles/procserv/tasks/main.yml
- name: Build and install procServ at the requested version
  ansible.builtin.raw: |
    set -e
    repo="{{ repo_procserv }}"
    src="{{ path_procserv_src }}"
    bin="{{ path_procserv_bin }}"
    ref="{{ procserv_version }}"
    rm -rf "${src}"
    git clone "${repo}" "${src}"
    if [ -n "${ref}" ]; then git -C "${src}" checkout "${ref}"; fi
    /usr/local/sbin/record-iocrunner-source app_procserv "${repo}" "${src}"
    cd "${src}" && make init && make conf && make build && make install
    rm -rf "${src}"
    test -x "${bin}"
  changed_when: false
