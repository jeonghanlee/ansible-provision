---
# roles/archiver_build/tasks/main.yml
#
# Installs the EPICS Archiver Appliance by driving the epicsarchiverap-env make
# sequence, which clones and builds epicsarchiverap-maven from source
# internally. This operator owns orchestration, refs, config, and the service
# account; epicsarchiverap-env owns each make target's internals. It runs as
# root like the other build operators; epicsarchiverap-env's internal sudo
# no-ops when already root, so no build-user split is needed.
#
# Prerequisites come earlier in the archiver_dev species: the java operator
# (JDK 21 + JAVA_HOME), the tomcat operator (/opt/tomcat9 shared CATALINA_HOME),
# and the mariadb operator (archappl DB and account on its socket). This
# operator installs its own build tools (git, make, unzip, sed, tree, curl),
# mirroring epics_build; epicsarchiverap-env's install_os_packages.bash is
# skipped.
#
# The build runs as a detached systemd transient unit (systemd-run), not inline
# over the SSH session: a long `./mvnw` on a cold ~/.m2 cannot leave a dropped
# connection with a half-built tree that a retry mistakes for progress. The
# launch step is idempotent (skip installed, leave a running unit alone, else
# clean-start); ansible then polls the unit to a success sentinel. Mirrors the
# epics_build operator.

- name: Install the detached archiver build script
  ansible.builtin.raw: |
    cat > /usr/local/sbin/archiver-build.sh <<'ARCHIVER_BUILD_SCRIPT'
    #!/bin/bash
    set -e

    sentinel=/var/tmp/archiver-build.done
    stamp=/var/tmp/archiver-build.config

    group="{{ archiver_group }}"
    user="{{ archiver_user }}"
    gid="{{ archiver_gid }}"
    repo="{{ repo_archiver_env }}"
    ref="{{ archiver_env_ref }}"
    src_parent="{{ path_archiver_env_src }}"
    src_tag="{{ archiver_maven_src_tag }}"
    site_id="{{ archiver_site_id }}"
    db_name="{{ archiver_db_name }}"
    db_user="{{ archiver_db_user }}"
    pass_file="{{ archiver_db_password_file }}"
    db_socket="{{ archiver_db_socket }}"
    db_host="{{ archiver_db_host }}"
    db_port="{{ archiver_db_port }}"
    storage_top="{{ archiver_storage_top }}"
    install_parent="{{ archiver_install_parent }}"
    heapsize="{{ archiver_java_heapsize }}"
    sts_gran="{{ archiver_store_sts_granularity }}"
    sts_hold="{{ archiver_store_sts_hold }}"
    mts_gran="{{ archiver_store_mts_granularity }}"
    mts_hold="{{ archiver_store_mts_hold }}"
    lts_gran="{{ archiver_store_lts_granularity }}"
    root_level="{{ archiver_root_logger_level }}"

    top="${src_parent}/epicsarchiverap-env"

    # --- Database transport: "auto" is the socket the mariadb operator
    # manages; empty keeps TCP. ---
    if [ "${db_socket}" = auto ]; then
      if [ -f /etc/redhat-release ]; then
        db_socket=/run/mariadb/mariadb.sock
      else
        db_socket=/run/mysqld/mysqld.sock
      fi
    fi
    if [ -n "${db_socket}" ] && [ ! -S "${db_socket}" ]; then
      echo "archiver_build: ${db_socket} is not a socket; apply the mariadb operator first" >&2
      exit 1
    fi

    # --- The application password is made on this host by the mariadb operator
    # and read here, so it never travels from the control host. The launch step
    # has already refused a build without the file. ---
    db_pass=""
    IFS= read -r db_pass < "${pass_file}" || true
    if [ -z "${db_pass}" ]; then
      echo "archiver_build: ${pass_file} holds no password; apply the mariadb operator first" >&2
      exit 1
    fi

    # --- Site proxy: a login shell reads /etc/profile.d, but a systemd-run unit
    # starts with no profile, so http_proxy and its peers are absent and an
    # external wget (Maven) or git fetch would fail. Source the cloud-provision
    # proxy contract when present; a direct-net host simply has no such file. ---
    for proxy_env in /etc/profile.d/*proxy*.sh; do
      [ -f "${proxy_env}" ] && . "${proxy_env}" || true
    done

    # --- Maven proxy: Maven reads a proxy only from a settings file. Measured on
    # the build host: http_proxy, mvn -Dhttps.proxyHost, and MAVEN_OPTS carried as
    # JVM startup arguments all leave Maven Central unreachable; a settings file
    # resolves it. The file is selected with -gs, an explicit path, because under
    # the wrapper both the user settings and the wrapper conf sit under the home
    # of whoever runs the build, so neither survives a change of build user. ---
    # The settings file itself belongs to the cloud-provision proxy contract, which
    # writes it at /etc/maven-proxy-settings.xml. This operator only consumes it,
    # and never writes one of its own: a host-level proxy artifact has a single
    # owner, and a second generator would drift from it. Maven does not read that
    # path automatically, so -gs names it. A direct-network host has no such file
    # and needs no settings; a proxied host without one is refused before the
    # build starts, in the launch step. Any file left by the earlier interim
    # approach is removed so a host cannot keep consuming a stale copy.
    contract_settings=/etc/maven-proxy-settings.xml
    rm -f "${src_parent}/maven-settings.xml"
    maven_flags=""
    if [ -f "${contract_settings}" ]; then
      maven_flags="-gs ${contract_settings}"
    fi
    printf '%s\n' "archiver_build: maven proxy settings: ${maven_flags:-none}"

    # --- OS build-tool packages and JAVA_HOME (TOMCAT_HOME is /opt/tomcat9).
    # The epicsarchiverap-env install_os_packages.bash is skipped; install its
    # build tools here (mirrors epics_build). The -devel deps come with the
    # epics operator.
    . /etc/os-release
    case "${ID}" in
      rocky|rhel|centos)
        java_home=/usr/lib/jvm/java-21-openjdk
        dnf install -y git tree make unzip sed curl wget
        ;;
      debian|ubuntu)
        java_home=/usr/lib/jvm/java-21-openjdk-amd64
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y git tree make unzip sed curl wget
        ;;
      *) echo "archiver_build: unsupported OS ID=${ID}" >&2; exit 1 ;;
    esac

    # --- Service group and runtime account (site-set GID; nologin) ---
    # The epicsarchiverap-env install would create these too; pre-creating fixes
    # the GID and epicsarchiverap-env then no-ops on the existing user/group.
    if ! getent group "${group}" >/dev/null; then
      if [ -n "${gid}" ]; then groupadd -g "${gid}" "${group}"; else groupadd "${group}"; fi
    fi
    if ! id "${user}" >/dev/null 2>&1; then
      useradd --system -g "${group}" -M -s /usr/sbin/nologin "${user}"
    fi

    # --- Clone epicsarchiverap-env at the pinned ref; self-clean any partial
    # tree first ---
    rm -rf "${top}"
    install -d -m 0755 "${src_parent}"
    git clone "${repo}" "${top}"
    git -C "${top}" checkout "refs/tags/${ref}" 2>/dev/null || git -C "${top}" checkout "${ref}"

    # --- Site overrides in ../CONFIG_SITE.local (one dir above the checkout;
    # it is -included and survives the OS-conf rewrite we never trigger) ---
    printf '%s\n' \
      "AA_USERID:=${user}" \
      "AA_GROUPID:=${group}" \
      "JAVA_HOME=${java_home}" \
      "TOMCAT_HOME=/opt/tomcat9" \
      "DB_NAME=${db_name}" \
      "DB_USER=${db_user}" \
      "DB_HOST_NAME=${db_host}" \
      "DB_HOST_PORT=${db_port}" \
      "ARCHAPPL_STORAGE_TOP=${storage_top}" \
      "AA_INSTALL_PATH=${install_parent}" \
      "AA_JAVA_HEAPSIZE=${heapsize}" \
      "ARCHAPPL_SITEID:=${site_id}" > "${src_parent}/CONFIG_SITE.local"
    # The password the mariadb operator set; this file is -included after
    # CONFIG_SITE, so it replaces the epicsarchiverap-env default. The file now
    # carries a credential, so only root reads it.
    printf 'DB_USER_PASS=%s\n' "${db_pass}" >> "${src_parent}/CONFIG_SITE.local"
    # With a socket, every MariaDB connection of the appliance and of the
    # epicsarchiverap-env clients uses it, and DB_HOST_NAME/DB_HOST_PORT go
    # unused; left empty, the epicsarchiverap-env default keeps TCP.
    if [ -n "${db_socket}" ]; then
      printf 'DB_SOCKET:=%s\n' "${db_socket}" >> "${src_parent}/CONFIG_SITE.local"
    fi
    chmod 0600 "${src_parent}/CONFIG_SITE.local"
    # Select the Maven settings file through the epicsarchiverap-env MAVEN_FLAGS
    # hook, which is appended to every mvn invocation. CONFIG_SITE.local is
    # included after the empty epicsarchiverap-env default, so this assignment
    # wins. Left unset on a direct-net host, where the epicsarchiverap-env
    # default stands and Maven goes direct. The hook is not MAVEN_OPTS: that
    # name is the JVM-options variable of Maven itself.
    if [ -n "${maven_flags}" ]; then
      printf 'MAVEN_FLAGS:=%s\n' "${maven_flags}" >> "${src_parent}/CONFIG_SITE.local"
    fi
    # Store policy per tier. Each value is written only when set, so an unset
    # one leaves the epicsarchiverap-env default in place; the launch step has
    # already checked the names, the holds and the order across tiers.
    for store_setting in "ARCHAPPL_STS_GRANULARITY=${sts_gran}" "ARCHAPPL_STS_HOLD=${sts_hold}" \
        "ARCHAPPL_MTS_GRANULARITY=${mts_gran}" "ARCHAPPL_MTS_HOLD=${mts_hold}" \
        "ARCHAPPL_LTS_GRANULARITY=${lts_gran}"; do
      if [ -n "${store_setting#*=}" ]; then
        printf '%s\n' "${store_setting%%=*}:=${store_setting#*=}" >> "${src_parent}/CONFIG_SITE.local"
      fi
    done
    # Root log level, written only when set; the launch step has checked it.
    if [ -n "${root_level}" ]; then
      printf 'ARCHAPPL_ROOT_LOGGER_LEVEL:=%s\n' "${root_level}" >> "${src_parent}/CONFIG_SITE.local"
    fi

    # --- Pin the epicsarchiverap-maven source ref (make init clones it at
    # SRC_TAG) ---
    printf 'SRC_TAG:=%s\n' "${src_tag}" > "${top}/configure/RELEASE.local"

    # --- Build and install, epicsarchiverap-env driving epicsarchiverap-maven
    # internally. conf.storage, install, and sd_start are the root steps; never
    # `make build` wholesale, which bundles conf.storage. ---
    cd "${top}"
    make init
    make db.conf
    make conf.archapplproperties
    make build.mvn
    make sql.fill
    # Before epicsarchiverap-env 1fc20a8 (jeonghanlee/epicsarchiverap-env#47),
    # sql.fill exited 0 even when the schema load did nothing, leaving the
    # database empty; the count stays as a guard, so no path that lets sql.fill
    # pass can install on an empty database. On an empty one the appliance still
    # starts, archives and serves, so every later check passes while PV
    # configuration fails to persist, showing only as errors in the mgmt log,
    # and survives only in memory until the next restart. Count the tables
    # before treating the step as done, and stop here rather than install and
    # start on a database the appliance cannot write to; an unreadable count
    # stops the build too. Ask over the same transport (socket or TCP) and
    # account the appliance uses, which proves the application login too.
    schema_query="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${db_name}'"
    if [ -n "${db_socket}" ]; then
      set -- --protocol=SOCKET --socket="${db_socket}"
    else
      set -- --protocol=TCP -h "${db_host}" -P "${db_port}"
    fi
    schema_tables=$(MYSQL_PWD="${db_pass}" mysql "$@" -u "${db_user}" -N -B -e "${schema_query}") || schema_tables=""
    # A forced reinstall stopped the previous appliance before this build began,
    # and install has not run yet, so its tree is intact but nothing is serving.
    # Say so on the way out, with the way back, rather than leave it down unnoticed.
    stopped_note=""
    if [ -d "${install_parent}/epicsarchiverap-maven/mgmt" ]; then
      stopped_note="archiver_build: the previous appliance under ${install_parent}/epicsarchiverap-maven is left stopped; start it with 'systemctl start epicsarchiverap-maven.service' or re-apply without archiver_force_reinstall"
    fi
    if [ -z "${schema_tables}" ]; then
      echo "archiver_build: cannot read ${db_name} to confirm the schema after sql.fill" >&2
      if [ -n "${stopped_note}" ]; then echo "${stopped_note}" >&2; fi
      exit 1
    fi
    if [ "${schema_tables}" -eq 0 ]; then
      echo "archiver_build: the epicsarchiverap-env sql.fill exited 0 but loaded no schema; ${db_name} has no tables, so the appliance would not persist PV configuration" >&2
      if [ -n "${stopped_note}" ]; then echo "${stopped_note}" >&2; fi
      exit 1
    fi
    make conf.storage
    make install
    make sd_start

    # Success sentinel: reached only when set -e let every step pass. The poll
    # step reads this to tell a finished install from a failed one. The stamp
    # beside it records the knob set this install was configured with, so a later
    # run can see that the desired configuration has moved away from it.
    printf '%s\n' "{{ archiver_config_stamp }}" > "${stamp}"
    touch "${sentinel}"
    ARCHIVER_BUILD_SCRIPT
    chmod 0755 /usr/local/sbin/archiver-build.sh
  changed_when: false

- name: Keep a persistent, bounded host journal for the appliance
  ansible.builtin.raw: |
    set -e
    dropin="{{ archiver_journal_dropin }}"
    want=$(printf '%s\n' \
      "# Written by the ansible-provision archiver_build operator." \
      "[Journal]" \
      "Storage=persistent" \
      "MaxRetentionSec={{ archiver_journal_max_retention }}" \
      "SystemMaxUse={{ archiver_journal_system_max_use }}" \
      "RateLimitIntervalSec={{ archiver_journal_rate_limit_interval }}" \
      "RateLimitBurst={{ archiver_journal_rate_limit_burst }}")
    # Restart journald only when the drop-in changes; with Storage=persistent it
    # creates /var/log/journal and moves the volatile journal there on restart.
    if [ -f "${dropin}" ] && [ "$(cat "${dropin}")" = "${want}" ]; then
      echo "ARCHIVER_JOURNAL_UNCHANGED"
      exit 0
    fi
    install -d -m 0755 "$(dirname "${dropin}")"
    printf '%s\n' "${want}" > "${dropin}"
    chmod 0644 "${dropin}"
    systemctl restart systemd-journald.service
    echo "ARCHIVER_JOURNAL_UPDATED"
  register: archiver_journal
  changed_when: "'ARCHIVER_JOURNAL_UPDATED' in archiver_journal.stdout"

- name: Launch the detached archiver build unit
  ansible.builtin.raw: |
    set -e
    install_root="{{ archiver_install_parent }}/epicsarchiverap-maven"
    sentinel=/var/tmp/archiver-build.done
    stamp=/var/tmp/archiver-build.config
    unit=archiver-build.service
    force="{{ archiver_force_reinstall | bool | lower }}"
    want_stamp="{{ archiver_config_stamp }}"

    # Will this run build at all? A forced reinstall always does, and so does an
    # absent install; an installed host that was not forced does not.
    will_build=no
    if [ "${force}" = "true" ] || ! ls -d "${install_root}/mgmt" >/dev/null 2>&1; then
      will_build=yes
    fi

    # A build needs the Maven settings the proxy contract owns, so refuse now,
    # before anything is torn down, rather than let mvn fail deep in dependency
    # resolution with nothing but "Network is unreachable" - that failure cost a
    # full diagnosis once already. This SSH session carries the contract
    # environment, so http_proxy answers whether the host is proxied at all; a
    # direct-network host needs no settings and passes straight through.
    if [ "${will_build}" = "yes" ] && [ -n "${http_proxy}" ] && [ ! -f /etc/maven-proxy-settings.xml ]; then
      echo "ARCHIVER_BUILD_PRECONDITION: this host is proxied but carries no /etc/maven-proxy-settings.xml." >&2
      echo "Maven takes a proxy only from a settings file, and that file belongs to the cloud-provision proxy contract." >&2
      echo "Apply a proxy contract that provides it, then re-run. Nothing was stopped and no build was started." >&2
      exit 1
    fi

    # The build hands epicsarchiverap-env the password the mariadb operator made
    # on this host; without that file the appliance could not log in, so refuse
    # before anything is torn down.
    pass_file="{{ archiver_db_password_file }}"
    if [ "${will_build}" = "yes" ] && [ ! -s "${pass_file}" ]; then
      echo "ARCHIVER_BUILD_PRECONDITION: ${pass_file} is missing or empty; apply the mariadb operator first." >&2
      echo "Nothing was stopped and no build was started." >&2
      exit 1
    fi

    # The store policy reaches epicsarchiverap-env only inside the build, so
    # check it here, before anything is torn down. epicsarchiverap-env rejects a
    # bad name or hold only once the build is under way, and leaves the order
    # across tiers to the operator.
    sts_gran="{{ archiver_store_sts_granularity }}"
    sts_hold="{{ archiver_store_sts_hold }}"
    mts_gran="{{ archiver_store_mts_granularity }}"
    mts_hold="{{ archiver_store_mts_hold }}"
    lts_gran="{{ archiver_store_lts_granularity }}"
    store_rank() {
      case "$1" in
        PARTITION_5MIN) echo 1 ;;
        PARTITION_15MIN) echo 2 ;;
        PARTITION_30MIN) echo 3 ;;
        PARTITION_HOUR) echo 4 ;;
        PARTITION_DAY) echo 5 ;;
        PARTITION_MONTH) echo 6 ;;
        PARTITION_YEAR) echo 7 ;;
        *) echo 0 ;;
      esac
    }
    store_error=""
    if [ -n "${sts_gran}${mts_gran}${lts_gran}" ]; then
      if [ -z "${sts_gran}" ] || [ -z "${mts_gran}" ] || [ -z "${lts_gran}" ]; then
        store_error="set all three store granularities or none (STS [${sts_gran}], MTS [${mts_gran}], LTS [${lts_gran}])"
      else
        sts_rank=$(store_rank "${sts_gran}")
        mts_rank=$(store_rank "${mts_gran}")
        lts_rank=$(store_rank "${lts_gran}")
        if [ "${sts_rank}" -eq 0 ] || [ "${mts_rank}" -eq 0 ] || [ "${lts_rank}" -eq 0 ]; then
          store_error="a store granularity must be one of PARTITION_5MIN PARTITION_15MIN PARTITION_30MIN PARTITION_HOUR PARTITION_DAY PARTITION_MONTH PARTITION_YEAR (STS [${sts_gran}], MTS [${mts_gran}], LTS [${lts_gran}])"
        elif [ "${sts_rank}" -ge "${mts_rank}" ] || [ "${mts_rank}" -ge "${lts_rank}" ]; then
          store_error="store granularities must run strictly finer to coarser from STS to LTS (STS [${sts_gran}], MTS [${mts_gran}], LTS [${lts_gran}])"
        fi
      fi
    fi
    for store_hold in "${sts_hold}" "${mts_hold}"; do
      case "${store_hold}" in
        "") ;;
        0*|*[!0-9]*) store_error="${store_error:-a store hold must be a positive integer (got [${store_hold}])}" ;;
      esac
    done
    if [ "${will_build}" = "yes" ] && [ -n "${store_error}" ]; then
      echo "ARCHIVER_BUILD_PRECONDITION: ${store_error}." >&2
      echo "Nothing was stopped and no build was started." >&2
      exit 1
    fi

    # The database socket reaches epicsarchiverap-env only inside the build:
    # "auto", an absolute path, or empty for TCP.
    db_socket="{{ archiver_db_socket }}"
    case "${db_socket}" in
      ""|auto|/*) ;;
      *)
        if [ "${will_build}" = "yes" ]; then
          echo "ARCHIVER_BUILD_PRECONDITION: archiver_db_socket must be auto, an absolute socket path, or empty for TCP (got [${db_socket}])." >&2
          echo "Nothing was stopped and no build was started." >&2
          exit 1
        fi
        ;;
    esac

    # The root log level reaches epicsarchiverap-env only inside the build;
    # refuse a value log4j2 does not know before anything is torn down.
    root_level="{{ archiver_root_logger_level }}"
    case "${root_level}" in
      ""|OFF|FATAL|ERROR|WARN|INFO|DEBUG|TRACE|ALL) ;;
      *)
        if [ "${will_build}" = "yes" ]; then
          echo "ARCHIVER_BUILD_PRECONDITION: archiver_root_logger_level must be empty or one of OFF FATAL ERROR WARN INFO DEBUG TRACE ALL (got [${root_level}])." >&2
          echo "Nothing was stopped and no build was started." >&2
          exit 1
        fi
        ;;
    esac

    # An explicit reinstall was asked for: stop the appliance so
    # epicsarchiverap-env installs over a quiet tree, drop the previous result,
    # and fall through to the build.
    if [ "${force}" = "true" ]; then
      systemctl stop epicsarchiverap-maven.service 2>/dev/null || true
      rm -f "${sentinel}" "${stamp}"

    # Already installed (the mgmt instance is present): do not rebuild, but
    # ensure the appliance is actually serving. One unit runs the four Tomcat
    # instances in the foreground under the archappl.bash launcher, which ends
    # the service when any JVM dies: the survivors stop and the unit is left
    # failed (Restart=no). The unit state alone would therefore catch a dead
    # instance, but the four instances are checked as well, so a launcher that
    # stays up without them is not taken for a serving appliance. Repair with
    # restart, which starts a failed unit and replaces a degraded running one;
    # start would be a no-op on the latter.
    elif ls -d "${install_root}/mgmt" >/dev/null 2>&1; then
      missing=""
      for instance in mgmt engine etl retrieval; do
        pgrep -f "catalina.base=${install_root}/${instance}" >/dev/null 2>&1 || missing="${missing} ${instance}"
      done
      if [ -z "${missing}" ] && systemctl is-active --quiet epicsarchiverap-maven.service; then
        echo "ARCHIVER_BUILD_SKIPPED: already installed, all four instances live"
      else
        systemctl restart epicsarchiverap-maven.service
        echo "ARCHIVER_BUILD_REPAIRED: restarted the installed appliance; instances missing:${missing}"
      fi
      # Configuration drift is reported, never acted on here: rebuilding a live
      # appliance because a variable moved is the owner decision, taken with
      # archiver_force_reinstall. An install predating the stamp leaves no basis
      # to compare, which is reported as unknown rather than as drift.
      if [ ! -f "${stamp}" ]; then
        echo "ARCHIVER_BUILD_STAMP_UNKNOWN: installed before the config stamp existed; drift cannot be judged"
      elif [ "$(cat "${stamp}")" != "${want_stamp}" ]; then
        echo "ARCHIVER_BUILD_DRIFT: installed with [$(cat "${stamp}")] but this run wants [${want_stamp}]"
      fi
      exit 0
    fi

    # A build unit already running (e.g. it survived a dropped SSH connection):
    # leave it; the poll step waits. Match every non-final state, not just
    # "active", so the brief "activating" window is not missed.
    state=$(systemctl is-active "${unit}" 2>/dev/null || true)
    case "${state}" in
      active|activating|deactivating|reloading)
        echo "ARCHIVER_BUILD_RUNNING: existing unit"
        exit 0
        ;;
    esac

    # Not installed and no running unit: clear any stale result and sentinel,
    # then start a fresh detached build. The script self-cleans partial state.
    systemctl reset-failed "${unit}" 2>/dev/null || true
    rm -f "${sentinel}"
    systemd-run --unit="${unit}" --collect --setenv=HOME=/root /usr/local/sbin/archiver-build.sh
    echo "ARCHIVER_BUILD_STARTED"
  register: archiver_build_launch
  changed_when: >-
    'ARCHIVER_BUILD_STARTED' in archiver_build_launch.stdout or
    'ARCHIVER_BUILD_REPAIRED' in archiver_build_launch.stdout

- name: Stop on configuration drift against the installed appliance
  ansible.builtin.raw: |
    printf '%s\n' "The installed appliance was configured with a different knob set than this run wants." >&2
    printf '%s\n' "Nothing was changed. Re-run with -e archiver_force_reinstall=true to rebuild and reinstall." >&2
    printf '%s\n' "{{ archiver_build_launch.stdout | regex_search('ARCHIVER_BUILD_DRIFT.*') }}" >&2
    exit 1
  when: "'ARCHIVER_BUILD_DRIFT' in archiver_build_launch.stdout"
  changed_when: false

- name: Wait for the detached archiver build to finish
  ansible.builtin.raw: |
    unit=archiver-build.service
    sentinel=/var/tmp/archiver-build.done
    # Still running in any non-final state ("activating" included): keep polling.
    state=$(systemctl is-active "${unit}" 2>/dev/null || true)
    case "${state}" in
      active|activating|deactivating|reloading)
        echo "BUILDING"
        exit 1
        ;;
    esac
    # This task runs only when a build was launched or was already running, so the
    # success sentinel is the one valid signal that it finished. An existing
    # install tree is no longer accepted in its place: a forced reinstall leaves
    # the previous tree standing, and reading that as success would hide a failed
    # rebuild.
    if [ -f "${sentinel}" ]; then
      echo "DONE"
      exit 0
    fi
    echo "FAILED: build unit exited without a success sentinel" >&2
    journalctl -u "${unit}" --no-pager 2>/dev/null | tail -n 80 >&2
    exit 2
  when: >-
    'ARCHIVER_BUILD_STARTED' in archiver_build_launch.stdout or
    'ARCHIVER_BUILD_RUNNING' in archiver_build_launch.stdout
  register: archiver_build_wait
  until: archiver_build_wait.rc != 1
  retries: 80
  delay: 30
  changed_when: false
  failed_when: archiver_build_wait.rc == 2

- name: Show the installed appliance instances and service state
  ansible.builtin.raw: |
    ls -d {{ archiver_install_parent }}/epicsarchiverap-maven/{mgmt,engine,etl,retrieval} 2>/dev/null
    systemctl is-active epicsarchiverap-maven.service 2>/dev/null || true
  changed_when: false
