---
# roles/conserver/tasks/main.yml
- name: Build and install conserver at the requested version
  ansible.builtin.raw: |
    set -e
    repo="{{ repo_conserver }}"
    src="{{ path_conserver_src }}"
    conserver_bin="{{ path_conserver_bin }}"
    console_bin="{{ path_console_bin }}"
    ref="{{ conserver_version }}"
    rm -rf "${src}"
    git clone "${repo}" "${src}"
    if [ -n "${ref}" ]; then git -C "${src}" checkout "${ref}"; fi
    /usr/local/sbin/record-iocrunner-source app_conserver "${repo}" "${src}"
    cd "${src}" && make init && make conf && make build && make install
    rm -rf "${src}"
    test -x "${conserver_bin}"
    test -x "${console_bin}"
  changed_when: false
