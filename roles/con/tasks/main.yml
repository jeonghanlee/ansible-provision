---
# roles/con/tasks/main.yml
- name: Build and install con at the requested version
  ansible.builtin.raw: |
    set -e
    repo="{{ repo_con }}"
    src="{{ path_con_src }}"
    bin="{{ path_con_bin }}"
    ref="{{ con_version }}"
    rm -rf "${src}"
    git clone "${repo}" "${src}"
    if [ -n "${ref}" ]; then git -C "${src}" checkout "${ref}"; fi
    /usr/local/sbin/record-iocrunner-source app_con "${repo}" "${src}"
    cd "${src}" && make && make install DESTDIR=/usr/local
    rm -rf "${src}"
    test -x "${bin}"
  changed_when: false
