---
# roles/proxy/defaults/main.yml

# Single-authority proxy contract script in the control-host cloud-provision
# checkout. The role streams this to the target and runs it in reconcile mode; it
# is never vendored into this repository. Override per site if the cloud-provision
# checkout does not sit beside this one.
proxy_contract_path: "{{ role_path }}/../../../cloud-provision/bin/proxy_contract.bash"

# Site proxy URL. No value ships here; inject it per host through an inventory
# override or -e proxy_url=<url>. The role fails when it is unset.
proxy_url: ""

# Cloud uses schema 1. General-server uses schema 2 on Rocky Linux 8.10 and
# reconciles system proxy settings without a VM account or SSH configuration.
proxy_scope: "cloud"

# Compatibility input for existing callers. Reconciliation always checks the
# complete artifact set; an identical application remains unchanged.
proxy_force: false
