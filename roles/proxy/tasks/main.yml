---
# roles/proxy/tasks/main.yml
# Live/Instant proxy reconciliation. Streams the single-authority proxy contract
# from the control-host cloud-provision checkout to the target and runs it in
# reconcile mode. The contract owns the artifact set (cloud-provision
# ADR-20260820); this role does not reimplement it. Golden-mode seal stays on
# the cloud-provision bake side. Raw and root-only so it runs before P_common
# on every family, including Rocky where Python-backed modules are unavailable.
- name: Reconcile the site proxy contract
  ansible.builtin.raw: |
    /bin/bash -p -s << 'PROXY_ROLE_WRAPPER_EOF'
    set -euo pipefail
    export PATH=/usr/sbin:/usr/bin:/sbin:/bin
    unset BASH_ENV ENV CDPATH
    umask 0077
    proxy_url="$(printf '%s' {{ ((proxy_url ~ '.') | b64encode) | quote }} | base64 --decode)"
    proxy_url="${proxy_url%.}"
    proxy_scope={{ proxy_scope | quote }}
    readonly runtime=/run/cloud-provision
    readonly staged="${runtime}/proxy_contract.bash"
    readonly input="${runtime}/proxy-contract.input"
    if [[ "$(id -u)" != 0 || -z "${proxy_url}" ||
          "${proxy_url}" == *$'\n'* || "${proxy_url}" == *$'\r'* ]]; then
      printf '%s\n' 'Error: root and a nonempty single-line proxy_url are required' >&2
      exit 1
    fi
    case "${proxy_scope}" in
      cloud)
        schema=1
        result_pattern='^proxy_contract schema=1 mode=reconcile os=(debian|ubuntu|rocky) identities=[1-9][0-9]* changed=(true|false)$'
        ;;
      general-server)
        schema=2
        result_pattern='^proxy_contract schema=2 mode=reconcile scope=general-server os=(rocky) identities=6 changed=(true|false)$'
        ;;
      *)
        printf '%s\n' 'Error: proxy_scope must be cloud or general-server' >&2
        exit 1
        ;;
    esac
    readonly schema result_pattern

    function require_directory {
      local path="$1" mode
      if [[ ! -d "${path}" || -L "${path}" ||
            "$(stat -c '%u:%g' -- "${path}")" != 0:0 ]]; then
        printf '%s\n' 'Error: unsafe proxy staging parent' >&2
        exit 1
      fi
      mode="$(stat -c '%a' -- "${path}")"
      if (( (8#${mode} & 0022) != 0 )); then
        printf '%s\n' 'Error: writable proxy staging parent' >&2
        exit 1
      fi
    }

    function require_control_file {
      local path="$1" mode="$2"
      if [[ -e "${path}" || -L "${path}" ]]; then
        if [[ ! -f "${path}" || -L "${path}" ||
              "$(stat -c '%u:%g:%a:%h' -- "${path}")" != "0:0:${mode}:1" ]]; then
          printf '%s\n' 'Error: unsafe proxy control file' >&2
          exit 1
        fi
      fi
    }

    require_directory /
    require_directory /run
    if [[ ! -e "${runtime}" && ! -L "${runtime}" ]]; then
      mkdir -m 0700 -- "${runtime}"
      chown root:root -- "${runtime}"
    fi
    require_directory "${runtime}"
    require_control_file "${staged}" 700
    require_control_file "${input}" 600
    require_control_file "${runtime}/proxy-contract.lock" 600
    if [[ "${proxy_scope}" == general-server ]]; then
      chmod 0700 -- "${runtime}"
    fi

    workspace="$(mktemp -d "${runtime}/.proxy-role.XXXXXX")"
    trap 'rm -rf -- "${workspace}"' EXIT
    trap 'exit 1' HUP INT TERM
    cat > "${workspace}/script" << 'PROXY_CONTRACT_SCRIPT_EOF'
    {{ lookup('ansible.builtin.file', proxy_contract_path) }}
    PROXY_CONTRACT_SCRIPT_EOF
    test -s "${workspace}/script"
    chown root:root -- "${workspace}/script"
    chmod 0700 -- "${workspace}/script"
    mv -f -- "${workspace}/script" "${staged}"
    sha="$(sha256sum "${staged}" | cut -d' ' -f1)"
    {
      printf 'schema=%s\n' "${schema}"
      if [[ "${proxy_scope}" == general-server ]]; then
        printf 'scope=general-server\n'
      fi
      printf 'proxy_url=%s\n' "${proxy_url}"
      printf 'script_sha256=%s\n' "${sha}"
    } > "${workspace}/input"
    chown root:root -- "${workspace}/input"
    chmod 0600 -- "${workspace}/input"
    mv -f -- "${workspace}/input" "${input}"

    rc=0
    /bin/bash -p "${staged}" reconcile > "${workspace}/stdout" 2> "${workspace}/stderr" || rc=$?
    if [[ "${rc}" != 0 ]]; then
      printf 'Error: proxy reconciliation failed (exit %s)\n' "${rc}" >&2
      exit 1
    fi
    result="$(cat "${workspace}/stdout")"
    if [[ "$(wc -l < "${workspace}/stdout")" -ne 1 || ! "${result}" =~ ${result_pattern} ]]; then
      printf '%s\n' 'Error: invalid proxy reconciliation result' >&2
      exit 1
    fi
    case "${BASH_REMATCH[2]}" in
      true) printf 'changed\n' ;;
      false) printf 'unchanged\n' ;;
    esac
    PROXY_ROLE_WRAPPER_EOF
  register: proxy_apply
  changed_when: "proxy_apply.stdout | trim == 'changed'"
  no_log: true
