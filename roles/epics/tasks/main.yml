---
# roles/epics/tasks/main.yml
# IOCs are compiled on the distribution image, so it carries the EPICS OS build
# dependencies too. The set is the normative one in cloud-provision
# configure/epics-packages, mirrored per vacuum as epics_os_packages; the
# epics_build role installs the same list from the same source.
- name: Install the EPICS OS build dependencies
  ansible.builtin.raw: |
    set -e
    . /etc/os-release
    case " $ID ${ID_LIKE:-} " in
      *rhel*|*fedora*|*centos*|*rocky*)
        dnf install -y {{ epics_os_packages | join(' ') }}
        ;;
      *debian*|*ubuntu*)
        export DEBIAN_FRONTEND=noninteractive
        apt update -y
        apt install -y {{ epics_os_packages | join(' ') }}
        ;;
    esac
  changed_when: false

- name: Prepare the EPICS install root
  ansible.builtin.raw: |
    set -e
    p="{{ path_epics_local }}"
    g="{{ epics_install_group }}"
    install -d "${p}"
    if [ -n "${g}" ]; then
      chgrp "${g}" "${p}"
      chmod 2775 "${p}"
      setfacl -d -m g:"${g}":rwx "${p}"
      setfacl -d -m o::rx "${p}"
      git config --system --get-all safe.directory | grep -Fxq "${p}" || git config --system --add safe.directory "${p}"
    else
      chown "{{ epics_ioc_engineers[0] }}" "${p}"
    fi
    test -d "${p}"
  changed_when: false

- name: Check out the EPICS distribution at the requested version
  ansible.builtin.raw: |
    set -e
    owner="{{ epics_ioc_engineers[0] }}"
    local="{{ path_epics_local }}"
    repo="{{ repo_epics }}"
    tag="{{ epics_env_version }}"
    tree="{{ epics_env_version }}/{{ epics_os_dir }}/{{ epics_base_version }}"
    mode="{{ epics_clone_mode }}"
    case "${mode}" in
      minimal|full) ;;
      *) printf 'error: epics_clone_mode must be minimal or full, got: %s\n' "${mode}" >&2; exit 1 ;;
    esac
    clone_opt=""; fetch_opt=""
    if [ "${mode}" != "full" ]; then
      clone_opt="--depth 1 --filter=blob:none --sparse"
      fetch_opt="--depth 1 --filter=blob:none"
    fi
    if [ ! -d "${local}/.git" ]; then
      sudo -u "${owner}" git clone ${clone_opt} --branch "${tag}" "${repo}" "${local}"
    else
      sudo -u "${owner}" git -C "${local}" fetch ${fetch_opt} --force origin "refs/tags/${tag}:refs/tags/${tag}"
      sudo -u "${owner}" git -C "${local}" checkout --force "refs/tags/${tag}"
    fi
    if [ "${mode}" = "full" ]; then
      sudo -u "${owner}" git -C "${local}" sparse-checkout disable
    else
      sudo -u "${owner}" git -C "${local}" sparse-checkout set "${tree}"
    fi
    /usr/local/sbin/record-iocrunner-source app_epics "${repo}" "${local}"
    test -d "${local}/${tag}"
  changed_when: false

- name: Deploy EPICS environment activation script
  ansible.builtin.raw: |
    set -e
    env_script="{{ path_epics_local }}/{{ epics_env_version }}/{{ epics_os_dir }}/{{ epics_base_version }}/setEpicsEnv.bash"
    test -f "${env_script}"
    cat > /etc/profile.d/epics-env.sh << 'EOF'
    source {{ path_epics_local }}/{{ epics_env_version }}/{{ epics_os_dir }}/{{ epics_base_version }}/setEpicsEnv.bash
    EOF
    chmod 0644 /etc/profile.d/epics-env.sh
  changed_when: false

- name: Detect RedHat family from os-release
  ansible.builtin.raw: . /etc/os-release && case " $ID ${ID_LIKE:-} " in *rhel*|*fedora*|*centos*|*rocky*) exit 0;; *) exit 1;; esac
  register: epics_family_redhat
  failed_when: false
  changed_when: false
  check_mode: false

- name: Enable firewalld with the EPICS ports (RedHat family)
  ansible.builtin.raw: |
    set -e
    dnf install -y firewalld
    systemctl enable --now firewalld
    ca_zone="{{ epics_ca_zone }}"; ca_opt=""; if [ -n "${ca_zone}" ]; then ca_opt="--zone=${ca_zone}"; fi
    pva_zone="{{ epics_pva_zone }}"; pva_opt=""; if [ -n "${pva_zone}" ]; then pva_opt="--zone=${pva_zone}"; fi
    for z in "${ca_zone}" "${pva_zone}"; do
      if [ -n "$z" ]; then
        firewall-cmd --permanent --get-zones | tr ' ' '\n' | grep -qx "$z" || { printf 'error: firewalld zone does not exist: %s\n' "$z" >&2; exit 1; }
      fi
    done
    firewall-cmd --permanent --add-service=ntp || true
    for port in {% for p in epics_ca_ports_tcp %}{{ p }}/tcp {% endfor %}{% for p in epics_ca_ports_udp %}{{ p }}/udp {% endfor %}; do
      firewall-cmd --permanent ${ca_opt} --add-port=$port
    done
    for port in {% for p in epics_pva_ports_tcp %}{{ p }}/tcp {% endfor %}{% for p in epics_pva_ports_udp %}{{ p }}/udp {% endfor %}; do
      firewall-cmd --permanent ${pva_opt} --add-port=$port
    done
    firewall-cmd --reload
  when: epics_family_redhat.rc == 0
  changed_when: false
