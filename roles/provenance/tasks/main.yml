---
# roles/provenance/tasks/main.yml
- name: Install IOC runner bake provenance recorder
  ansible.builtin.raw: |
    set -e
    target="/usr/local/sbin/record-iocrunner-source"
    parent="${target%/*}"
    test -d "${parent}"
    test ! -L "${parent}"
    test "$(stat -Lc '%u' "${parent}")" = "0"
    mode="$(stat -Lc '%a' "${parent}")"
    other_digit="${mode#${mode%?}}"
    owner_group_digits="${mode%?}"
    group_digit="${owner_group_digits#${owner_group_digits%?}}"
    case "${group_digit}${other_digit}" in
      *[2367]*) exit 2 ;;
    esac
    if [ -e "${target}" ] || [ -L "${target}" ]; then
      test -f "${target}"
      test ! -L "${target}"
    fi
    tmp="$(mktemp "${parent}/.record-iocrunner-source.tmp.XXXXXX")"
    trap 'rm -f "${tmp}"' EXIT
    trap 'exit 1' HUP INT TERM
    cat > "${tmp}" << 'EOF'
    {{ lookup('ansible.builtin.file', role_path + '/files/record-iocrunner-source.bash') }}
    EOF
    chown root:root "${tmp}"
    chmod 0755 "${tmp}"
    if [ ! -f "${target}" ] || ! cmp -s "${tmp}" "${target}" || \
       [ "$(stat -Lc '%u:%g:%a' "${target}")" != "0:0:755" ]; then
      mv -f "${tmp}" "${target}"
      trap - EXIT
      trap - HUP INT TERM
      printf changed
    else
      printf unchanged
    fi
  register: bake_provenance_install
  changed_when: "bake_provenance_install.stdout | trim == 'changed'"
