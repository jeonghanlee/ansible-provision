---
# roles/python/defaults/main.yml
# Python runtime provisioned before EPICS. Both the P_epics clone and the
# P_epics-build source build depend on it.
pkg_python_debian:
  - python3
  - python3-pip
  # Dev headers (Python.h): pip_packages_pyioc build C extensions from source.
  - python3-dev
  - python3-serial
  - python-is-python3
  - python3-numpy
  - python3-pyparsing
  - python3-build
  - python3-nose2
  - gcovr
  - flawfinder
# Generic RedHat-family python; rocky8 overrides to the 3.9 module in its
# vacuum group_vars.
pkg_python_redhat:
  - python3
  - python3-pip
  # Dev headers (Python.h): source-built C extensions (pip_packages_pyioc,
  # pyDevSup) need them, same as python3-dev on debian.
  - python3-devel
pkg_python_system:
  - python3-pyserial
pip_bin:                 "/usr/bin/pip3"
pip_packages_global:     ["numpy", "pyparsing"]
pip_packages_epics:      ["nose2"]
# EPICS Python IOC stack: pip-only, no apt equivalent, installed on every OS.
pip_packages_pyioc:      ["epicscorelibs", "softioc", "cothread"]
# Python command alternatives set on the RedHat family, as name -> target path.
# Each entry is applied only if its alternatives group exists; a present group
# that fails to set aborts loudly. Debian uses the python-is-python3 package.
runtime_python_alts:
  - { name: python, path: /usr/bin/python3 }
