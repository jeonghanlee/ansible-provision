---
# roles/python/tasks/main.yml
#
# P_python: provision the Python 3 and pip runtime that both EPICS acquisition
# paths need - the P_epics binary distribution (which installs no Python) and
# the P_epics-build source build. Kept as a shared prerequisite rather than
# inside either. One raw task: build and clone hosts boot a plain base cloud
# image without a Python ansible facts can rely on, so OS branching lives in
# the shell via /etc/os-release.

- name: Provision the Python runtime
  ansible.builtin.raw: |
    set -e
    . /etc/os-release
    case " $ID ${ID_LIKE:-} " in
      *rhel*|*fedora*|*centos*|*rocky*)
        dnf install -y {{ (pkg_python_redhat + pkg_python_system) | join(' ') }}
        {{ pip_bin }} install {{ (pip_packages_global + pip_packages_epics + pip_packages_pyioc) | join(' ') }}
        for _pair in {% for a in runtime_python_alts %}{{ a.name }}:{{ a.path }} {% endfor %}; do
          _name=${_pair%%:*}
          _path=${_pair#*:}
          alternatives --display "$_name" >/dev/null 2>&1 && alternatives --set "$_name" "$_path"
        done
        ;;
      *debian*|*ubuntu*)
        export DEBIAN_FRONTEND=noninteractive
        apt update -y
        apt install -y {{ pkg_python_debian | join(' ') }}
        {{ pip_bin }} install --break-system-packages {{ pip_packages_pyioc | join(' ') }}
        ;;
    esac
  changed_when: false
