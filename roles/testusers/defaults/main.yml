---
# roles/testusers/defaults/main.yml
# Multi-user test fixture accounts for the epics-ioc-runner
# gate/RUNBOOK.md scenarios.
# Baked into the iocrunner golden through the iocrunner species assembly
# (see docs/test_users_handoff.md). Goldens baked before the activation
# need per-run provisioning.

# Operators: joined to the product ioc group, so the sudoers NOPASSWD
# systemctl gate applies (full IOC lifecycle in system mode).
test_users_operators: [opa, opb]

# Observer: deliberately outside ioc; the negative control where every
# state-changing call must fail at the sudo gate.
test_users_observer: obs

# Local-mode users: ordinary logins, no ioc, no sudo. Linger is enabled
# so systemctl --user runs without an interactive session.
test_users_local: [usera, userb]

# Operators with linger: joined to ioc like the operators, and lingering like
# the local-mode users, so one account can run an IOC with systemctl --user
# and then as a system service through the sudoers gate.
test_users_operators_linger: [opc]

# Product group the operators join (created by the iocrunner role / setup).
test_users_ioc_group: ioc
