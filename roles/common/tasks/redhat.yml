---
# roles/common/tasks/redhat.yml
- name: Install dnf-plugins-core and EPEL
  ansible.builtin.raw: dnf install -y dnf-plugins-core epel-release
  changed_when: false

- name: Enable the PowerTools or CRB repository
  ansible.builtin.raw: dnf config-manager --set-enabled powertools 2>/dev/null || dnf config-manager --set-enabled crb
  changed_when: false

- name: Install P_common packages (RedHat family)
  ansible.builtin.raw: "dnf install -y {{ (common_pkg_must_rocky + common_pkg_nice) | join(' ') }}"
  changed_when: false

# RHEL-family sudo secure_path excludes /usr/local, so sudo cannot resolve
# tools installed under /usr/local/bin or /usr/local/sbin. Prepend both via a
# validated sudoers drop-in; Debian already includes them in its default
# secure_path.
- name: Add /usr/local to sudo secure_path
  ansible.builtin.raw: |
    set -e
    target="/etc/sudoers.d/secure-path"
    desired='Defaults secure_path="/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin"'
    tmp="$(mktemp)"
    printf '%s\n' "$desired" > "$tmp"
    if [ -f "$target" ] && cmp -s "$tmp" "$target"; then
      rm -f "$tmp"
      printf "unchanged\n"
    elif visudo -cf "$tmp" >/dev/null 2>&1; then
      install -m 0440 -o root -g root "$tmp" "$target"
      rm -f "$tmp"
      printf "changed\n"
    else
      rm -f "$tmp"
      printf "secure_path sudoers validation failed; /etc/sudoers.d left untouched\n" >&2
      exit 1
    fi
  register: secure_path_dropin
  changed_when: "secure_path_dropin.stdout | trim == 'changed'"
