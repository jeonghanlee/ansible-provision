---
# roles/common/tasks/main.yml
# P_common: applied first on every vacuum. Family detection sources
# /etc/os-release and judges by exit code, not stdout: raw stdout capture
# proved unreliable for the first become task on ansible_connection=local,
# while rc always arrives intact.
- name: Detect RedHat family from os-release
  ansible.builtin.raw: . /etc/os-release && case " $ID ${ID_LIKE:-} " in *rhel*|*fedora*|*centos*|*rocky*) exit 0;; *) exit 1;; esac
  register: os_family_redhat
  failed_when: false
  changed_when: false
  check_mode: false

- name: Detect Debian family from os-release
  ansible.builtin.raw: . /etc/os-release && case " $ID ${ID_LIKE:-} " in *debian*|*ubuntu*) exit 0;; *) exit 1;; esac
  register: os_family_debian
  failed_when: false
  changed_when: false
  check_mode: false

- name: Include RedHat tasks
  ansible.builtin.include_tasks: redhat.yml
  when: os_family_redhat.rc == 0

- name: Include Debian tasks
  ansible.builtin.include_tasks: debian.yml
  when: os_family_debian.rc == 0

- name: Ensure includedir is the final active directive in /etc/sudoers
  ansible.builtin.raw: |
    set -e
    sudoers=/etc/sudoers
    idr_line="$(grep -nE '^[[:space:]]*[#@]includedir[[:space:]]+/etc/sudoers\.d' "$sudoers" | tail -1 | cut -d: -f1)"
    if [ -z "$idr_line" ]; then
      printf "unchanged\n"
      exit 0
    fi
    trailing="$(tail -n +"$((idr_line + 1))" "$sudoers" | grep -E '^[[:space:]]*([^#[:space:]]|[#@]include)' || true)"
    if [ -z "$trailing" ]; then
      printf "unchanged\n"
      exit 0
    fi
    idr_text="$(sed -n "${idr_line}p" "$sudoers")"
    # Same-filesystem temp file so the final mv is an atomic rename(2):
    # /etc/sudoers is never truncated or absent, even on interruption.
    tmp="$(mktemp /etc/sudoers.XXXXXX)"
    grep -vE '^[[:space:]]*[#@]includedir[[:space:]]+/etc/sudoers\.d' "$sudoers" > "$tmp"
    printf '%s\n' "$idr_text" >> "$tmp"
    if visudo -cf "$tmp" >/dev/null 2>&1; then
      chmod 0440 "$tmp"
      chown root:root "$tmp"
      mv -f "$tmp" "$sudoers"
      printf "changed\n"
    else
      rm -f "$tmp"
      printf "visudo validation failed; /etc/sudoers left untouched\n" >&2
      exit 1
    fi
  register: sudoers_includedir
  changed_when: "sudoers_includedir.stdout | trim == 'changed'"

- name: Expose the KVM PTP clock for chrony
  ansible.builtin.raw: |
    set -e
    state=unchanged
    conf=/etc/modules-load.d/ptp_kvm.conf
    rule=/etc/udev/rules.d/99-ptp-kvm.rules
    want_rule='SUBSYSTEM=="ptp", ATTR{clock_name}=="KVM virtual PTP", SYMLINK+="ptp_kvm"'
    if [ "$(cat "$conf" 2>/dev/null)" != "ptp_kvm" ]; then
      printf '%s\n' ptp_kvm > "$conf"
      state=changed
    fi
    if [ "$(cat "$rule" 2>/dev/null)" != "$want_rule" ]; then
      printf '%s\n' "$want_rule" > "$rule"
      udevadm control --reload
      state=changed
    fi
    # The module loads only on a KVM guest; elsewhere the load fails harmlessly
    # and no link appears.
    if [ ! -e /dev/ptp_kvm ]; then
      modprobe ptp_kvm 2>/dev/null || true
      udevadm trigger --subsystem-match=ptp --action=add
      udevadm settle
    fi
    printf '%s\n' "$state"
  register: chrony_ptp_kvm_setup
  changed_when: "chrony_ptp_kvm_setup.stdout | trim == 'changed'"
  when: chrony_ptp_kvm | bool

- name: Deploy chrony configuration
  ansible.builtin.raw: |
    set -e
    target="/etc/chrony.conf"
    if [ -d /etc/chrony ]; then
      target="/etc/chrony/chrony.conf"
    fi
    tmp="$(mktemp)"
    cat > "$tmp" << 'CHRONYEOF'
    {% for server in ntp_servers %}pool {{ server }} iburst{% if chrony_minpoll != '' %} minpoll {{ chrony_minpoll }}{% endif %}{% if chrony_maxpoll != '' %} maxpoll {{ chrony_maxpoll }}{% endif +%}
    {% endfor %}driftfile {{ chrony_driftfile }}
    makestep {{ chrony_makestep }}
    {% if chrony_rtcsync %}rtcsync
    {% endif %}{% if chrony_keyfile != '' %}keyfile {{ chrony_keyfile }}
    {% endif %}{% if chrony_leapsectz != '' %}leapsectz {{ chrony_leapsectz }}
    {% endif %}logdir {{ chrony_logdir }}
    CHRONYEOF
    {% if chrony_ptp_kvm | bool %}
    # Only a host that has the KVM clock gets the refclock, so chrony never
    # starts against a missing device.
    if [ -e /dev/ptp_kvm ]; then
      printf '%s\n' "refclock PHC /dev/ptp_kvm poll 2" >> "$tmp"
    fi
    {% endif %}
    if [ -f "$target" ] && cmp -s "$tmp" "$target"; then
      rm -f "$tmp"
      printf "unchanged\n"
    else
      install -m 0644 "$tmp" "$target"
      rm -f "$tmp"
      printf "changed\n"
    fi
  register: chrony_config
  changed_when: "chrony_config.stdout | trim == 'changed'"
  notify: Restart chronyd

- name: Enable and start chronyd
  ansible.builtin.raw: systemctl enable chronyd 2>/dev/null || true; systemctl start chronyd
  changed_when: false

# A changed configuration takes effect through the restart handler; run it now
# so the wait below watches the new configuration, not the old one.
- name: Apply a changed chrony configuration
  ansible.builtin.meta: flush_handlers

- name: Wait for chrony to synchronize to the KVM PTP clock
  ansible.builtin.raw: |
    if [ ! -e /dev/ptp_kvm ]; then
      printf '%s\n' "no KVM PTP clock; chrony serves from the pools"
    elif chronyc waitsync 6 >/dev/null 2>&1; then
      printf '%s\n' "synchronized"
    else
      printf '%s\n' "chrony did not report synchronization within about 60 s"
    fi
  register: chrony_ptp_kvm_wait
  changed_when: false
  when: chrony_ptp_kvm | bool

# The wait never fails the play, so surface a clock that did not converge,
# which a raw task shows only under -v.
- name: Report a clock that did not synchronize to the KVM PTP clock
  ansible.builtin.debug:
    msg: "{{ chrony_ptp_kvm_wait.stdout | default('') | trim }}"
  when:
    - chrony_ptp_kvm | bool
    - "'did not report' in (chrony_ptp_kvm_wait.stdout | default(''))"
