---
# roles/app_epics/tasks/main.yml
- name: Prepare the EPICS install root
  ansible.builtin.raw: |
    set -e
    install -d {{ path_epics_local }}
    if [ -n "{{ epics_install_group }}" ]; then
      chgrp {{ epics_install_group }} {{ path_epics_local }}
      chmod 2775 {{ path_epics_local }}
    else
      chown {{ epics_ioc_engineers[0] }} {{ path_epics_local }}
    fi
  changed_when: false

- name: Clone the EPICS distribution as the IOC owner (sparse, tag-pinned)
  ansible.builtin.raw: |
    set -e
    owner="{{ epics_ioc_engineers[0] }}"
    if [ ! -d {{ path_epics_local }}/.git ]; then
      sudo -u "${owner}" git clone --depth 1 --filter=blob:none --sparse --branch {{ epics_env_version }} {{ repo_epics }} {{ path_epics_local }}
      sudo -u "${owner}" git -C {{ path_epics_local }} sparse-checkout set {{ epics_env_version }}/{{ epics_os_dir }}/{{ epics_base_version }}
      /usr/local/sbin/record-iocrunner-source app_epics {{ repo_epics }} {{ path_epics_local }}
    fi
    test -d {{ path_epics_local }}/.git
  changed_when: false

- name: Deploy EPICS environment activation script
  ansible.builtin.raw: |
    set -e
    env_script="{{ path_epics_local }}/{{ epics_env_version }}/{{ epics_os_dir }}/{{ epics_base_version }}/setEpicsEnv.bash"
    test -f "${env_script}"
    cat > /etc/profile.d/epics-env.sh << 'EOF'
    source {{ path_epics_local }}/{{ epics_env_version }}/{{ epics_os_dir }}/{{ epics_base_version }}/setEpicsEnv.bash
    EOF
    chmod 0644 /etc/profile.d/epics-env.sh
  changed_when: false
