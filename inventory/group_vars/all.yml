---
# inventory/group_vars/all.yml
# Values consumed by more than one operator. Everything an operator consumes
# alone lives in that operator role's defaults; site overlays override either
# plane through the usual variable precedence.

# NTP servers consumed by the common role's chrony template and readable by
# any diagnostic play.
# (chrony parameters live in roles/common/defaults.)

# IOC management group members, consumed by the epics, iocrunner, and
# testusers operators. Override in site overlays.
epics_ioc_engineers:
  - vmadmin

# EPICS install root and build flavor, shared by the epics_build and
# epics_support operators.
path_epics_install:     "/opt/epics"
epics_env_build_flavor: "internal"
